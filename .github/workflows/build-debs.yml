name: Build and Release Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: contains(github.event.head_commit.message, '[RELEASE]')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get latest release tag (e.g. v1.6.0), strip 'v', default to 1.0.0
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName // "v1.0.0"' 2>/dev/null || echo "v1.0.0")
          VERSION="${LATEST#v}"
          echo "Last release: $VERSION"

          # Split into MAJOR.MINOR.PATCH and increment patch
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "New version: $NEW_VERSION"

          # Write new version into build_deb.sh
          sed -i "s/VERSION=\"\${VERSION:-[^}]*}\"/VERSION=\"\${VERSION:-${NEW_VERSION}}\"/" build_deb.sh

          # Commit the version bump back to main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_deb.sh
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: bump-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # pull the version-bumped commit

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git dpkg-dev alien fakeroot zstd

      - name: Build Debian Package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Build Fedora RPM Package
        run: |
          chmod +x build_rpm.sh
          ./build_rpm.sh

      - name: Build Arch Linux Package
        run: |
          chmod +x build_arch.sh
          ./build_arch.sh

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vozes-packages-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.bump-version.outputs.new_version }}"
          TAG="v${VERSION}"

          echo "Creating/updating release for tag: $TAG"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading packages to it..."
            gh release upload "$TAG" ./artifacts/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" ./artifacts/* \
              --title "Release v$VERSION" \
              --notes "Automated release of Vozes v$VERSION. Contains Debian (.deb), Fedora (.rpm), and Arch Linux (.pkg.tar.zst) packages for AMD64 and ARM64." \
              --draft=false \
              --prerelease=false
          fi

      - name: Get Uploaded Asset URLs
        id: get_urls
        run: |
          VERSION="${{ needs.bump-version.outputs.new_version }}"
          TAG="v${VERSION}"
          URLS=""
          for file in ./artifacts/*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
              URLS="${URLS} ${URL}"
            fi
          done
          URLS=$(echo "$URLS" | xargs)
          echo "package_urls=$URLS" >> $GITHUB_OUTPUT
          echo "Constructed URL list: $URLS"

      - name: Notify Inled Repo
        env:
          INLED_REPO_PAT: ${{ secrets.INLED_REPO_PAT }}
        run: |
          URLS="${{ steps.get_urls.outputs.package_urls }}"
          if [ -z "$INLED_REPO_PAT" ]; then
            echo "WARNING: INLED_REPO_PAT secret is not defined. Skipping Inled repository notification."
          else
            echo "Notifying Inled repository with package URLs..."
            curl -X POST -H "Accept: application/vnd.github.v3+json" \
                 -H "Authorization: token $INLED_REPO_PAT" \
                 https://api.github.com/repos/InledGroup/apt/dispatches \
                 -d "{\"event_type\": \"package_upload\", \"client_payload\": {\"package_urls\": \"$URLS\"}}"
            echo "Notification sent successfully."
          fi
